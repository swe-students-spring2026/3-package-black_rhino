[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackrhinorandomminigame"
description = "A lighthearted Python package with random mini-game utilities."
version = "0.1.3"
authors = [
  { name = "Chase Vitale" },
  { name = "Harrison Wong" },
  { name = "Jerry Wang" },
  { name = "Alan Wu" },
  { name = "Ethan Tan" }
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["python", "package", "random", "game"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/swe-students-spring2026/3-package-black_rhino"
"Repository" = "https://github.com/swe-students-spring2026/3-package-black_rhino.git"
"Bug Tracker" = "https://github.com/swe-students-spring2026/3-package-black_rhino/issues"


[tool.pytest.ini_options]
pythonpath = "src"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]